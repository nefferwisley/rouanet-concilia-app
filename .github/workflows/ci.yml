name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
      SUPABASE_JWT_SECRET: ci-placeholder-secret-not-used-for-real-auth
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        # test_projetos_extras.py testa routes/projetos_extras.py, um módulo órfão
        # (nunca registrado em main.py, superado pela implementação real em
        # routes/projetos.py) — ignorado até a limpeza manual (ver plano de execução).
        run: python -m pytest backend/tests motor/tests -v --ignore=backend/tests/test_projetos_extras.py

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run vitest
        run: npx vitest run

      - name: Type-check + build
        run: npm run build
