# Projeto 1961 / PRONAC 20-7453
# Circunstância Cinematográfica
# ========================================

projeto:
  pronac: "20-7453"
  campos:
    pronac: "pronac"
    nome: "nome"
    proponente: "proponente"
    controller: "controller"
    banco: "banco"
    resumo_pendencias: "resumo_pendencias"

banco_captador:
  banco_nome: "Banco do Brasil"
  agencia: "3210-9"
  conta: "14.209-1"
  saldo_inicial: 0.00

mapeamento_lancamentos:
  # JSON structure: { "realRows1961": [...] }
  projeto_path: null                         # JSON já é flat, não há aninhamento projetos[]
  lancamentos_field: "realRows1961"          # chave do array de lançamentos
  tipo_documento_default: null               # detecta pelo nome do arquivo

  campos_obrigatorios:
    prestador: "prestador"                   # nome do prestador/fornecedor
    data_pagamento: "rawDate"                # ISO 8601 (YYYY-MM-DD)
    valor_liquido: "valor"                   # valor em reais
    rubrica_salic: "rubrica"                 # código da rubrica (ex: 1.5.1)
    descricao: "item"                        # descrição da despesa

  campos_opcionais:
    razao_social: "razao"                    # razão social (PJ) do prestador
    cnpj_cpf: null                           # não tem no JSON de origem
    documento_ref: "docLink"                 # referência ao arquivo/documento
    confianca_ocr: "confidence"              # score 0-100 (será normalizado pra 0-1)
    valor_nota_fiscal: null                  # não existe separado do valor_liquido

regras_validacao:
  valor_minimo: 0.01
  valor_maximo: 9999999.99
  data_inicio_projeto: "2022-01-01"          # Projeto 1961 executado em 2022
  data_fim_projeto: "2023-12-31"
  rubrica_obrigatoria: true
  validar_cnpj_cpf: true                     # valida checksum de CNPJ/CPF se houver
  confianca_minima: 0.85                     # abaixo disto -> campos_revisao + REVISAO_PENDENTE

rubricas_salic:
  referencia_arquivo: null                   # pode apontar pra arquivo externo se quiser
  rubricas:                                  # orçamento aprovado do Projeto 1961
    "1.1.1": 30000.00
    "1.2.1": 5000.00
    "1.3.1": 5000.00
    "1.4.1": 20000.00
    "1.5.1": 11000.00
    "1.6.1": 4900.00
    "1.7.0": 19500.00
    "1.8.0": 8000.00
    "2.1.1": 20000.00
    "3.1.2": 15000.00
    "3.5.1": 1200.00
    "3.5.2": 12000.00
    "3.6.1": 1200.00
    "3.6.2": 800.00
    "3.6.3": 25000.00
    "3.7.1": 8000.00
    "3.8.1": 45000.00
    "4.1.0": 18000.00
    "4.1.2": 12000.00
    "4.2.0": 22000.00
    "4.3.0": 28000.00
    "5.1.0": 4644.00
    "5.1.2": 16000.00
    "5.2.0": 9000.00

importacao:
  modo: "commit"                            # "dry_run" (valida, não grava) | "commit" (grava)
  verbose: true                              # true = log cada linha
  parar_no_primeiro_erro: false              # false = continua processando mesmo com erros
